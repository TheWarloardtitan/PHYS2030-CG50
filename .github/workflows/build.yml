name: Build CG50 G3A

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl cmake make gcc g++ python3 python3-pil libpng-dev libusb-1.0-0-dev pkg-config

      - name: Install GiteaPC
        run: |
          curl -L "https://git.planet-casio.com/Lephenixnoir/GiteaPC/raw/branch/master/install.sh" -o /tmp/giteapc.sh
          bash /tmp/giteapc.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Toolchain
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          giteapc install Lephenixnoir/fxsdk:noudisks2 Lephenixnoir/sh-elf-binutils Lephenixnoir/sh-elf-gcc
          giteapc install Lephenixnoir/OpenLibm Vhex-Kernel-Core/fxlibc
          giteapc install Lephenixnoir/sh-elf-gcc
          giteapc install Lephenixnoir/gint

      - name: Build
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          fxsdk build-cg

      - name: Upload G3A
        uses: actions/upload-artifact@v4
        with:
          name: PHYS2030-CG50
          path: PHYS2030.g3a
