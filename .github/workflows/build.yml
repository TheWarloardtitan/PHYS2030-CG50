name: Build CG50 G3A

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl cmake make gcc g++ python3 python3-pil libpng-dev libusb-1.0-0-dev pkg-config

      - name: Install GiteaPC
        run: |
          curl -L "https://git.planet-casio.com/Lephenixnoir/GiteaPC/raw/branch/master/install.sh" -o /tmp/giteapc.sh
          bash /tmp/giteapc.sh

          echo "Finding GiteaPC installation..."
          find "$HOME" /usr/local -type f -name giteapc 2>/dev/null || true

          GITEAPC="$(find "$HOME" /usr/local -type f -name giteapc 2>/dev/null | head -n 1)"

          if [ -z "$GITEAPC" ]; then
            echo "ERROR: GiteaPC installer completed but giteapc executable was not found."
            exit 1
          fi

          echo "Found GiteaPC at: $GITEAPC"
          chmod +x "$GITEAPC"
          echo "$(dirname "$GITEAPC")" >> "$GITHUB_PATH"

      - name: Verify GiteaPC
        run: |
          echo "PATH=$PATH"
          which giteapc
          giteapc --help

      - name: Install CG50 toolchain
        run: |
          giteapc install Lephenixnoir/fxsdk:noudisks2 Lephenixnoir/sh-elf-binutils Lephenixnoir/sh-elf-gcc
          giteapc install Lephenixnoir/OpenLibm Vhex-Kernel-Core/fxlibc
          giteapc install Lephenixnoir/sh-elf-gcc
          giteapc install Lephenixnoir/gint

      - name: Build PHYS2030
        run: |
          which fxsdk
          fxsdk build-cg

      - name: Locate output
        run: |
          find . -type f -name "*.g3a" -print

      - name: Upload G3A
        uses: actions/upload-artifact@v4
        with:
          name: PHYS2030-CG50
          path: |
            **/*.g3a
